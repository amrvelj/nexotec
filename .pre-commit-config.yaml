# WP-2 PR-4 (ADR-011): SQLite is demoted from a CI lane to exactly this —
# a fast, optional, local pre-commit convenience. Postgres is the only
# lane that gates a merge (.github/workflows/test.yml's `postgres` job);
# this hook never runs in CI and never blocks a push, only a local commit,
# and only for someone who opted in with `pre-commit install`.
#
# Setup (once per clone):
#   pip install pre-commit
#   pre-commit install
repos:
  - repo: local
    hooks:
      - id: pytest-sqlite
        name: pytest (SQLite, fast pre-commit lane — ADR-011)
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
