# WP-8 PR-5: valuation is the 11th bounded context, the first new
# top-level package added since the ten were originally enumerated
# (CLAUDE.md's own table). Same reciprocal shape as inventory's own block
# above — sales is its first real consumer (trade-in), inventory reads it
# only via its own valuation_ref_* pointer (never imports this directly).
[[tool.importlinter.contracts]]
name = "Only app.valuation.public is reachable from outside valuation"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.integration",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = [
    "app.valuation.api",
    "app.valuation.models",
    "app.valuation.reconciliation",
    "app.valuation.schemas",
    "app.valuation.services",
]
allow_indirect_imports = true

# WP-6 PR-1: integration is the 12th bounded context — the generic
# secrets/connections/entitlements/call-log registry (Integrations & API
# Credentials v0.1's own "one registry, many gateways" split), plus the
# auto-i-dat-specific gateway logic (mock/real adapters, PR-2/3), which
# lives here rather than inside app.vehicle since it "never persists
# credentials of its own" and carries "no business data" (the spec's own
# words) — app.vehicle (PR-4) is its first real consumer, calling
# app.integration.public.call_capability the same way app.sales already
# calls app.inventory.public. Same reciprocal shape as every other
# built-out context above.
[[tool.importlinter.contracts]]
name = "Only app.integration.public is reachable from outside integration"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.valuation",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = [
    "app.integration.adapters",
    "app.integration.api",
    "app.integration.daily_jobs",
    "app.integration.errors",
    "app.integration.models",
    "app.integration.reconciliation",
    "app.integration.schemas",
    "app.integration.services",
]
allow_indirect_imports = true

# KAN-120: the aftersales and parts stubs gained their first module — the
# ownership provider each registers for the deactivation step (D-A-35),
# wired by app/ownership_registry.py, a composition root. Neither has a
# `public` yet; no other context has reason to import either.
[[tool.importlinter.contracts]]
name = "Only app.aftersales.public is reachable from outside aftersales"
type = "forbidden"
source_modules = [
    "app.platform",
