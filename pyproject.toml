[project]
name = "dms-platform"
version = "0.1.0"
description = "DMS MDM platform: tenancy, auth, audit, and API foundation for the automotive DMS shell."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.19,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "pyjwt>=2.13,<3.0",
    "psycopg[binary]>=3.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "httpx>=0.28,<0.29",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
