[project]
name = "dms-platform"
version = "0.1.0"
description = "DMS MDM platform: tenancy, auth, audit, and API foundation for the automotive DMS shell."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.19,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "pyjwt>=2.13,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    # Raised to 49.x with webauthn 3.x (KAN-386, Anto 2026-10-31, option A;
    # was <46, widened from <45 by WP-4 for joserfc). The RSA/PEM primitives
    # app/core/auth.py uses (load_pem_private_key, RSAPrivateKey/RSAPublicKey,
    # private_bytes) are unchanged across the bump; tests/test_auth.py signs
    # and verifies tokens with them. authlib, joserfc and pyOpenSSL (26.x,
    # pulled in by webauthn) resolve against 49.x.
    "cryptography>=49.0,<50.0",
    "email-validator>=2.2,<3.0",
    # KAN-196 (D-A-11): authlib stays for the EntraOidcProvider of [P3]; the
    # Zitadel front door that first brought it is gone (D-A-07).
    "authlib>=1.7,<2.0",
    # KAN-196: httpx carries the Have I Been Pwned range check (FR-AU-05).
    "httpx>=0.28,<0.29",
    "itsdangerous>=2.2,<3.0",
    # KAN-196 (D-A-12, D-A-09, A-13): the identity front door's three vetted
    # libraries — argon2id password hashing, TOTP, WebAuthn passkeys. No
    # hand-rolled crypto anywhere (Authentication & Identity, risks).
    "argon2-cffi>=23.1,<26.0",
    "pyotp>=2.9,<3.0",
    # webauthn 3.x needs cryptography>=49; raised together (KAN-386). 3.0.1 still
    # lets builtin exceptions out of some parsers: app/platform/services/mfa.py
    # keeps its shape checks and treats such an exception at registration as a
    # malformed answer (422).
    "webauthn>=3.0.1,<4.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk[fastapi]>=2.14,<3.0",
    "infisicalsdk>=1.0,<2.0",
    # WP-6b: the shared document-render layer's PDF backend (ADR-051 —
    # "buy, don't build"). Pure-Python at pip-install time, but still needs
    # Pango/GLib at import time for text shaping — see the Dockerfile's
    # runtime-stage apt-get comment. Only app.platform.services.
    # document_render may import this (tests/architecture/
    # test_no_layout_code_outside_document_render.py enforces it).
    "weasyprint>=69,<70",
    # KAN-205: the logo upload reads a PNG's size and checks its chunks with
    # Pillow — the decoder WeasyPrint itself prints raster images with, so a
    # PNG it accepts is one the renderer can print. It arrived only through
    # weasyprint; declared because app/platform/services/logo_validation.py
    # now imports it (as requests/urllib3 below). No new package: the SVG
    # sanitiser there is the standard library's expat and ElementTree.
    "pillow>=11.0,<14",
    # WP-6 PR-3: the real auto-i-dat adapter speaks SOAP. No SOAP/XML client
    # existed in this codebase before this. app/integration/adapters/
    # auto_i_dat_soap.py imports it lazily (inside build_zeep_client), so no
    # test or local dev path that never constructs a real adapter pays its
    # import cost or needs a live WSDL.
    "zeep>=4.2,<5",
    # KAN-108: the adapter tells a provider timeout from other transport
    # failures by the exception types of zeep's own HTTP stack. Both arrived
    # only through zeep; declared because auto_i_dat_soap.py now imports them.
    "requests>=2.31,<3",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    # httpx is a runtime dependency (the Have I Been Pwned range check,
    # KAN-196) — kept out of this list to avoid a duplicate pin; dev installs
    # still get it transitively via [project.dependencies].
    "import-linter>=2.5,<3.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.19,<2.0",
    # KAN-236: scripts/check_render_yaml.py validates render.yaml against Render's
    # Blueprint schema (the `deploy` lane of scripts/dev/check and a step in CI's
    # mypy job). PyYAML is declared because that script imports it (so does the
    # render.yaml mail test, KAN-397; it used to arrive only through uvicorn[standard]); the stub
    # packages keep `mypy app scripts` honest about both libraries.
    "jsonschema>=4.23,<5.0",
    "PyYAML>=6.0,<7.0",
    "types-jsonschema>=4.23,<5.0",
    "types-PyYAML>=6.0,<7.0",
]
# One-off tooling for regenerating checked-in seed data — NOT a runtime or
# test dependency. `scripts/gen_country_reference_seed.py` (KAN-32) pulls
# CLDR territory names through Babel to (re)generate
# app/platform/reference_data_seed/countries.csv. The application and the
# test suite read the checked-in CSV and never import babel.
#   pip install -e ".[seed-tools]"
seed-tools = [
    "babel>=2.14,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Skip reasons in every short summary: a bare "N skipped" hides that a
# Postgres-only test did not run on the SQLite fast lane (KAN-87). -r
# replaces pytest's default "fE", so failures and errors are named too.
addopts = "-rfEs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.platform.reference_data_seed" = ["*.csv"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = [
    # FastAPI's own DI idiom — every `Depends(...)` in a route signature
    # trips this. Standard posture for a FastAPI codebase, not a
    # suppression of a real problem; everything else B (bugbear) still
    # applies.
    "B008",
    # Old-style TypeVar generics -> PEP 695 syntax. Only fires on
    # app/core/pagination.py and app/core/tenancy.py, both on the
    # preserve-verbatim list — a style modernization isn't worth touching
    # them for.
    "UP047",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true

# Ships no type stubs / py.typed marker — a standard, narrow ignore for one
# untyped third-party package, not a suppression of anything this codebase
# controls (app/core/secrets.py is the only importer).
[[tool.mypy.overrides]]
module = "infisical_sdk.*"
ignore_missing_imports = true

# Same reasoning — no stubs shipped; app/platform/services/document_render.py
# is the only importer (WP-6b), enforced by tests/architecture/
# test_no_layout_code_outside_document_render.py.
[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore_missing_imports = true

# Babel ships its own types, but it is the optional `seed-tools` extra and
# `.[dev]` does not install it, so mypy cannot find it at all in CI.
# scripts/gen_country_reference_seed.py is the only importer (KAN-32),
# type-checked with scripts/ since KAN-142.
[[tool.mypy.overrides]]
module = "babel.*"
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# app.core (and app.db) is the base layer every context depends on; it must
# never depend back on a context. Kept as its own contract since the
# forbidden-internals contracts below only police context-to-context edges.
[[tool.importlinter.contracts]]
name = "app.core does not import any bounded context"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.valuation",
    "app.integration",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]

# One contract per context with modules: every top-level module of it except
# `public` is forbidden as an import target for every OTHER context, full
# stop — no ignore_imports, no exception list. app.<ctx>.public is simply
# never named as forbidden, so it's structurally the only way in; routing a
# new cross-context call through it needs no config change here, and
# reaching past it fails CI with no line anyone can add to make it pass.
#
# import-linter has no "all except public" form, so each list names every
# module (KAN-120). tests/architecture/test_import_contracts_cover_every_module.py
# fails when a context gains a top-level module or package that is neither
# `public` nor listed here, and when a context with modules has no contract.
# finance, reporting and compliance hold only `__init__.py`; the first module
# one of them gains needs its contract here, same shape.
[[tool.importlinter.contracts]]
name = "Only app.platform.public is reachable from outside platform"
type = "forbidden"
source_modules = [
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.valuation",
    "app.integration",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = [
    "app.platform.api",
    "app.platform.consumers",
    "app.platform.daily_jobs",
    "app.platform.models",
    "app.platform.reconciliation",
    "app.platform.reference_data_seed",
    "app.platform.schemas",
    "app.platform.services",
    "app.platform.session_guard",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.customer.public is reachable from outside customer"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.valuation",
    "app.integration",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = [
    "app.customer.api",
    "app.customer.consumers",
    "app.customer.models",
    "app.customer.ownership",
    "app.customer.reconciliation",
    "app.customer.schemas",
    "app.customer.services",
]
allow_indirect_imports = true

