# WP-7 PR-1: inventory was the first of the then "not built yet" contexts to
# ship models/services/api, and added its own reciprocal block here, same
# shape as every other context.
[[tool.importlinter.contracts]]
name = "Only app.inventory.public is reachable from outside inventory"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.valuation",
    "app.integration",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
