[project]
name = "dms-platform"
version = "0.1.0"
description = "DMS MDM platform: tenancy, auth, audit, and API foundation for the automotive DMS shell."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.19,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "pyjwt>=2.13,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    # Widened from <45.0 (WP-4): authlib's joserfc dependency requires
    # cryptography>=45.0.1. Verified the RSA/PEM primitives app/core/auth.py
    # uses (load_pem_private_key, RSAPrivateKey/RSAPublicKey, private_bytes)
    # are stable across this bump — no behavior change there.
    "cryptography>=44.0,<46.0",
    "email-validator>=2.2,<3.0",
    "authlib>=1.7,<2.0",
    "httpx>=0.28,<0.29",
    "itsdangerous>=2.2,<3.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk[fastapi]>=2.14,<3.0",
    "infisicalsdk>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    # httpx is a runtime dependency now (WP-4, app.platform.services.oidc's
    # token exchange) — kept out of this list to avoid a duplicate pin;
    # dev installs still get it transitively via [project.dependencies].
    "import-linter>=2.5,<3.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.19,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = [
    # FastAPI's own DI idiom — every `Depends(...)` in a route signature
    # trips this. Standard posture for a FastAPI codebase, not a
    # suppression of a real problem; everything else B (bugbear) still
    # applies.
    "B008",
    # Old-style TypeVar generics -> PEP 695 syntax. Only fires on
    # app/core/pagination.py and app/core/tenancy.py, both on the
    # preserve-verbatim list — a style modernization isn't worth touching
    # them for.
    "UP047",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true

# Ships no type stubs / py.typed marker — a standard, narrow ignore for one
# untyped third-party package, not a suppression of anything this codebase
# controls (app/core/secrets.py is the only importer).
[[tool.mypy.overrides]]
module = "infisical_sdk.*"
ignore_missing_imports = true

# Same reasoning — no stubs shipped; app/platform/services/oidc.py is the
# only importer (WP-4).
[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# app.core (and app.db) is the base layer every context depends on; it must
# never depend back on a context. Kept as its own contract since the
# forbidden-internals contracts below only police context-to-context edges.
[[tool.importlinter.contracts]]
name = "app.core does not import any bounded context"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]

# One contract per built-out context: its models/services/api are forbidden
# as import targets for every OTHER context, full stop — no ignore_imports,
# no exception list. app.<ctx>.public is simply never named as forbidden, so
# it's structurally the only way in; routing a new cross-context call through
# it needs no config change here, and reaching past it fails CI with no line
# anyone can add to make it pass.
#
# inventory/aftersales/parts/finance/reporting/compliance have no
# models/services/api yet (not built — CLAUDE.md). Whichever work package
# builds one out first must add its own contract below, same shape.
[[tool.importlinter.contracts]]
name = "Only app.platform.public is reachable from outside platform"
type = "forbidden"
source_modules = [
    "app.customer",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = ["app.platform.models", "app.platform.services", "app.platform.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.customer.public is reachable from outside customer"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.vehicle",
    "app.sales",
    "app.inventory",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = ["app.customer.models", "app.customer.services", "app.customer.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.vehicle.public is reachable from outside vehicle"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.customer",
    "app.sales",
    "app.inventory",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = ["app.vehicle.models", "app.vehicle.services", "app.vehicle.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only app.sales.public is reachable from outside sales"
type = "forbidden"
source_modules = [
    "app.platform",
    "app.customer",
    "app.vehicle",
    "app.inventory",
    "app.aftersales",
    "app.parts",
    "app.finance",
    "app.reporting",
    "app.compliance",
]
forbidden_modules = ["app.sales.models", "app.sales.services", "app.sales.api"]
allow_indirect_imports = true
