name: pr

# Route B (KAN-610, KAN-624): the session's own `scripts/dev/check` is the merge gate.
# GitHub runs only this one light, independent job per pull request; the full suite
# (Postgres pytest, migrations, outbox smoke, frontend, API-types drift) runs nightly
# on main in test.yml. One job, one checkout, one cached pip install: target under
# five billed minutes. Draft PRs run it too (KAN-653; Anto, 2026-11-11: the result is on
# the PR before it is marked ready), so `ready_for_review` is not a trigger - the head
# already has its run, and marking a draft ready would only repeat it. A newer push to
# the same PR cancels the run still going.
#
# The job name `pr-light` is what main's branch protection is to require, with `nexotec/check`
# (KAN-626, set by Anto) - do not rename it without changing the protection.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-light:
    name: pr-light
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # TruffleHog scans the PR's commits (base..head), so it needs the history.
          fetch-depth: 0
      # Every check below runs even when an earlier one failed (`!cancelled()`), so
      # one red run shows every problem; the job is red if any step is.
      - name: secret scan (TruffleHog, verified findings only)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: pip install -e ".[dev]"
        if: ${{ !cancelled() }}
        run: pip install -e ".[dev]"
      - name: ruff check app tests scripts
        if: ${{ !cancelled() }}
        run: ruff check app tests scripts
      - name: mypy app scripts
        if: ${{ !cancelled() }}
        run: mypy app scripts
      # KAN-236: render.yaml against the vendored copy of Render's Blueprint schema.
      - name: render.yaml matches Render's Blueprint schema
        if: ${{ !cancelled() }}
        run: python scripts/check_render_yaml.py
      - name: import-linter (context seams)
        if: ${{ !cancelled() }}
        run: lint-imports
      - name: docker build
        if: ${{ !cancelled() }}
        run: docker build -t dms-platform:ci .
