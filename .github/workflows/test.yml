    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # An upgrade from empty (see migration-smoke-test above) proves the
      # DDL is syntactically valid; it never proves anything about the path
      # a real deploy actually takes, which starts from whatever's already
      # applied. Before Route B this job ran on every PR and started from
      # `origin/main`'s alembic heads. Nightly on main (KAN-624) it starts
      # from the heads of the newest commit with a green nightly run - every
      # migration merged since then is upgraded over seeded data in one go,
      # the path a deploy of tonight's main takes from the last proven one.
      # Without such a run (the first night), or when it is this very commit
      # (a forced run), it starts from the previous commit, HEAD~1. Computed
      # here rather than hardcoded — main gains new heads as more migrations
      # land, and a hardcoded revision would silently stop testing the
      # real path the day it went stale. get_heads() is pure static
      # analysis of the revision files in that worktree; app.* is resolved
      # from this job's own editable install regardless of which directory
      # it's run from, so this doesn't need its own dependency install.
      - name: determine the previously-proven commit's alembic heads (the previously-deployed revision(s))
        id: previous
        env:
          PREVIOUS: ${{ needs.freshness.outputs.previous }}
        run: |
          base="$PREVIOUS"
          if [ -z "$base" ] || [ "$base" = "$GITHUB_SHA" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "upgrading from the alembic heads of $base"
          git worktree add /tmp/main-heads-checkout "$base"
          cd /tmp/main-heads-checkout
          HEADS=$(alembic heads | awk '{print $1}')
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/main-heads-checkout --force
          echo "revisions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$HEADS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # One `alembic upgrade <rev>` call per target revision, not a single
      # comma-separated call — alembic upgrade takes exactly one revision
      # argument. Looping is safe: each call only advances the branch(es)
      # that revision belongs to, so this correctly reaches every one of
      # main's heads regardless of how many there are today.
      - name: alembic upgrade to the previously-deployed revision(s)
        run: |
          while IFS= read -r rev; do
            [ -n "$rev" ] && alembic upgrade "$rev"
          done <<< "${{ steps.previous.outputs.revisions }}"
      - name: seed rows across customer, vehicle, transaction
        run: python scripts/seed_migration_smoke_test.py
      - name: alembic upgrade heads (this PR's migrations)
        run: alembic upgrade heads
      - name: verify the seeded rows survived untouched
        run: python scripts/verify_migration_smoke_test_seed.py

