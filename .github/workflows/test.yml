      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: regenerate openapi.json and schema.d.ts
        run: |
          PYTHONPATH=. python3 scripts/generate_openapi_schema.py
          cd frontend/apps/dms
          npx openapi-typescript ./openapi.json -o ./src/api/schema.d.ts --default-non-nullable false
      - name: fail if schema.d.ts is not what's checked in
        run: git diff --exit-code -- frontend/apps/dms/src/api/schema.d.ts

  # KAN-624: a red night opens a GitHub issue titled with the date and the failing
  # jobs, or comments on the one still open (label `nightly-red`), with the
  # workflow's own token. `failure()` is true when any job above failed; a skipped
  # night (freshness) is not a failure. The issue is closed by hand once main is green.
  alert:
    name: open an issue when the nightly run is red
    needs: [freshness, secret-scan, import-linter, ruff, mypy, frontend, docker-build, migration-smoke-test,
            migration-upgrade-from-previous, outbox-worker-smoke-test, postgres, frontend-openapi-drift]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          day=$(date -u +%F)
          where=""
          [ "$GITHUB_REF_NAME" = "main" ] || where=" (${GITHUB_REF_NAME}, dispatched)"
          title="Nightly CI red ${day}${where}: ${failed}"
          body="The nightly run on \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA} failed: ${failed}.

          Run: ${RUN_URL}

          Route B (KAN-610): main is only fully tested at night, so this break may have landed with any merge since the last green nightly run. File a Bug ticket on the Kanban board naming the failing job, fix it on a branch, and close this issue once a nightly run is green again."
          gh api "repos/${REPO}/labels" -f name=nightly-red -f color=B60205 \
            -f description="The nightly full CI run on main is red (KAN-624)" >/dev/null 2>&1 || true
          open=$(gh api "repos/${REPO}/issues?labels=nightly-red&state=open&per_page=1" --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh api "repos/${REPO}/issues/${open}/comments" -f body="**${title}**

          ${body}" >/dev/null
            echo "Commented on the open issue #${open}."
          else
            gh api "repos/${REPO}/issues" -f title="$title" -f body="$body" -f "labels[]=nightly-red" >/dev/null
            echo "Opened an issue: ${title}"
          fi
