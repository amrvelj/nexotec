name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-linter:
    name: import-linter (context seams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: lint-imports

  migration-smoke-test:
    name: alembic migration smoke test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_platform_migration_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DMS_DATABASE_URL: postgresql+psycopg://dms:dms@localhost:5432/dms_platform_migration_smoke
      # CI-only dummy key, not a secret — EncryptedString just needs a
      # structurally valid Fernet key to construct itself at settings load.
      DMS_TAX_ID_ENCRYPTION_KEY: d4Z9UU9FYX5HeORG4D0xtQy1AIAVBjGV08XGS06x4q8=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: alembic upgrade heads (from empty)
        run: alembic upgrade heads
      - name: seed rows across every table PR-2 touched
        run: python scripts/seed_migration_smoke_test.py
      # Targets an explicit revision (d2f7b0e9c453, the last trunk revision
      # before PR-2's FK-drop migration), never `alembic downgrade -1`.
      # With five heads (PR-3, ADR-015), "-1" is undefined — one step back
      # from *which* head? An explicit target has no such ambiguity: it's
      # well-defined regardless of how many heads exist, since Alembic
      # walks each branch's own path down to that common ancestor. This
      # also re-adds all 15 dropped FKs over the seeded, non-orphaned data
      # above — the actual point of this step.
      - name: alembic downgrade to d2f7b0e9c453 (re-adds all 15 FKs over seeded, non-orphaned data)
        run: alembic downgrade d2f7b0e9c453
      - name: alembic upgrade heads (again)
        run: alembic upgrade heads

  migration-upgrade-from-previous:
    name: alembic upgrade from previously-deployed revision (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_platform_migration_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DMS_DATABASE_URL: postgresql+psycopg://dms:dms@localhost:5432/dms_platform_migration_upgrade
      # CI-only dummy key, not a secret — EncryptedString just needs a
      # structurally valid Fernet key to construct itself at settings load.
      DMS_TAX_ID_ENCRYPTION_KEY: d4Z9UU9FYX5HeORG4D0xtQy1AIAVBjGV08XGS06x4q8=
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # An upgrade from empty (see migration-smoke-test above) proves the
      # DDL is syntactically valid; it never proves anything about the path
      # a real deploy actually takes, which starts from whatever's already
      # applied. That's `main`'s current alembic heads, computed here
      # rather than hardcoded — main gains new heads as more migrations
      # land, and a hardcoded revision would silently stop testing the
      # real path the day it went stale. get_heads() is pure static
      # analysis of the revision files in that worktree; app.* is resolved
      # from this job's own editable install regardless of which directory
      # it's run from, so this doesn't need its own dependency install.
      - name: determine main's current alembic heads (the previously-deployed revision(s))
        id: previous
        run: |
          git worktree add /tmp/main-heads-checkout origin/main
          cd /tmp/main-heads-checkout
          HEADS=$(alembic heads | awk '{print $1}')
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/main-heads-checkout --force
          echo "revisions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$HEADS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # One `alembic upgrade <rev>` call per target revision, not a single
      # comma-separated call — alembic upgrade takes exactly one revision
      # argument. Looping is safe: each call only advances the branch(es)
      # that revision belongs to, so this correctly reaches every one of
      # main's heads regardless of how many there are today.
      - name: alembic upgrade to the previously-deployed revision(s)
        run: |
          while IFS= read -r rev; do
            [ -n "$rev" ] && alembic upgrade "$rev"
          done <<< "${{ steps.previous.outputs.revisions }}"
      - name: seed rows across customer, vehicle, transaction
        run: python scripts/seed_migration_smoke_test.py
      - name: alembic upgrade heads (this PR's migrations)
        run: alembic upgrade heads
      - name: verify the seeded rows survived untouched
        run: python scripts/verify_migration_smoke_test_seed.py

  sqlite:
    name: pytest (sqlite, fast lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest

  postgres:
    name: pytest (postgres, issue #2+ FK/concurrency lane)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          DMS_TEST_DATABASE_URL: postgresql+psycopg://dms:dms@localhost:5432/dms_platform_test
