name: test

# Route B (KAN-610, KAN-624): the full suite runs once a night on main, not on every
# pull request or push. Per PR, pr.yml runs one light job (`pr-light`) and the session's
# own `scripts/dev/check` is the merge gate. What each job below proves is unchanged.
# A night whose main head already has a green run is skipped (`freshness`); a red night
# opens a GitHub issue labelled `nightly-red`, or comments on the open one (`alert`).
# There is no `push` trigger. The job names stay as they were (none is a required
# check: main has no branch protection - KAN-626 adds it for `pr-light`).

on:
  schedule:
    # 02:17 UTC every night (03:17 / 04:17 in Zurich), off the busy full hour.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when this commit already has a green nightly run
        type: boolean
        default: false

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # A green nightly run (scheduled or dispatched) for this exact commit already proves
  # it: skip the night. `previous` is the newest commit with a green nightly run - the
  # starting point of migration-upgrade-from-previous.
  freshness:
    name: skip when this commit already has a green nightly run
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.look.outputs.skip }}
      previous: ${{ steps.look.outputs.previous }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          green=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?branch=${{ github.ref_name }}&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | select(.id != ${{ github.run_id }}) | .head_sha]')
          previous=$(jq -r '.[0] // ""' <<<"$green")
          if [ "$FORCE" != "true" ] && jq -e --arg sha "${{ github.sha }}" 'any(.[]; . == $sha)' <<<"$green" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.sha }} already has a green nightly run - nothing to do tonight."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: secret scan (WP-2 PR-4, closes G-10)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  import-linter:
    name: import-linter (context seams)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: lint-imports

  ruff:
    # Covers scripts/ too since KAN-184. The name is kept from before Route B (KAN-624), when
    # it was a PR check; nothing requires it by name now (main has no branch protection).
    name: ruff (app/, tests/)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts

  mypy:
    # Covers scripts/ too since KAN-142. The name is kept from before Route B (KAN-624), when
    # it was a PR check; nothing requires it by name now (main has no branch protection).
    name: mypy (app/)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # scripts/ too (KAN-142): seed_staging_demo.py runs on every deploy, and a
      # service signature change once broke it with nothing to notice.
      - run: mypy app scripts
      # KAN-236: render.yaml validated against the vendored copy of Render's Blueprint
      # schema — the same script scripts/dev/check's `deploy` lane runs, and per PR pr.yml's
      # pr-light. `!cancelled()` (KAN-281): it still reports when mypy above fails; the job is
      # red either way.
      - run: python scripts/check_render_yaml.py
        if: ${{ !cancelled() }}

  frontend:
    name: frontend (oxlint, tsc, vitest, build)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: ui-kit oxlint
        working-directory: frontend/packages/ui-kit
        run: npx oxlint
      - name: ui-kit typecheck
        working-directory: frontend/packages/ui-kit
        run: npx tsc -b --noEmit
      - name: ui-kit vitest
        working-directory: frontend/packages/ui-kit
        run: npx vitest run
      - name: oxlint
        working-directory: frontend/apps/dms
        run: npx oxlint
      - name: tsc -b
        working-directory: frontend/apps/dms
        run: npx tsc -b
      - name: vitest
        working-directory: frontend/apps/dms
        run: npx vitest run
      - name: vite build
        working-directory: frontend/apps/dms
        run: npx vite build

  docker-build:
    name: docker image builds (WP-2 PR-3)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t dms-platform:ci .

  migration-smoke-test:
    name: alembic migration smoke test (postgres)
