      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: alembic upgrade heads
        run: alembic upgrade heads
      - name: publish a probe event
        id: publish
        run: echo "message_id=$(python scripts/publish_outbox_ci_probe.py)" >> "$GITHUB_OUTPUT"
      # This is deliberately the REAL entrypoint (`python -m app.worker`),
      # not poll_once() called directly from pytest — the same distinction
      # PR-3 drew between calling Alembic's Python API and running the
      # real `alembic` CLI. DMS_OUTBOX_WORKER_CI_SMOKE_TEST_PROBE=1 is the
      # only thing that differs from a real deployment: it registers one
      # no-op handler for the probe event type (see app/worker.py) so
      # there's something to dispatch. MAX_ITERATIONS bounds it so CI
      # terminates instead of running forever, which is what a real
      # deployment's worker does.
      - name: run the real worker entrypoint
        env:
          DMS_OUTBOX_WORKER_CI_SMOKE_TEST_PROBE: "1"
          DMS_OUTBOX_WORKER_MAX_ITERATIONS: "5"
        run: python -m app.worker
      - name: verify the probe was claimed, dispatched and published by that process
        run: python scripts/verify_outbox_ci_probe.py "${{ steps.publish.outputs.message_id }}"

  # WP-2 PR-4 (ADR-011): SQLite is no longer a CI lane at all — it never
  # gates a merge, matching the ADR's own wording exactly ("may never be
  # the only lane gating a merge" was already true with Postgres also
  # present; this goes further and removes it from CI entirely). It still
  # exists as a fast, opt-in *local* convenience — see .pre-commit-
  # config.yaml — which is genuinely optional and runs on no one's push.
  # Route B (KAN-624): the job name is kept, but what gates a merge now is the session's
  # scripts/dev/check, whose Postgres lane runs this same suite; this job is the nightly proof.
  postgres:
    name: pytest (postgres — the only lane that gates a merge, ADR-011)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms_platform_test
        ports:
          - 5432:5432
        # The data directory is in memory (tmpfs). Constraints, isolation and
        # locking behave exactly as on disk; only a crash would lose data, and
        # this database is thrown away with the job. The TRUNCATE before every
        # test (tests/conftest.py) is mostly file work, which memory makes
        # cheaper.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # WeasyPrint (WP-6b's PDF backend, app/platform/services/
      # document_render.py) is a pure-Python wheel but dlopen()s these at
      # import time — same package list as the Dockerfile's runtime stage,
      # not left to whatever ubuntu-latest happens to preinstall.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libglib2.0-0 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1 fonts-dejavu-core
      - run: pip install -e ".[dev]"
      # KAN-627: one worker per core, each on a database of its own
      # (dms_platform_test_gw0, _gw1 ...) that tests/conftest.py creates beside
      # the service's and drops again; the same tests as plain `pytest`.
      - run: pytest -n auto
        env:
          DMS_TEST_DATABASE_URL: postgresql+psycopg://dms:dms@localhost:5432/dms_platform_test

  # KAN-35 — frontend/apps/dms/src/api/schema.d.ts is generated from
  # app.openapi() and checked in; this job regenerates it and fails on any
  # diff, so a backend field can't drift out from under src/api/types.ts
  # unnoticed. No Postgres service and no DMS_DATABASE_URL: app.openapi()
  # only needs the app object built (import, not a live server) — same
  # WeasyPrint apt packages as the postgres job above because app.main
  # still imports that whole module graph, and the same CI-dummy Settings
  # env every other job here uses, for the same reason (see the comments
  # on migration-smoke-test).
  frontend-openapi-drift:
    name: frontend API types match the backend schema (KAN-35)
    needs: freshness
    if: ${{ needs.freshness.outputs.skip != 'true' }}
