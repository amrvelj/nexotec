      # migrate on start. Two overlapping `alembic upgrade heads` runs (empty
      # database, and one with migrations pending from d2f7b0e9c453) must both
      # exit 0 and leave every head and mapped table in place. Each trial uses
      # its own throwaway database on this job's Postgres.
      - name: concurrent alembic upgrade heads (two processes, 0.2 s apart)
        run: python scripts/check_concurrent_alembic_upgrade.py --repeat 3

