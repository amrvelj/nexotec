name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: secret scan (WP-2 PR-4, closes G-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  import-linter:
    name: import-linter (context seams)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: lint-imports

  ruff:
    name: ruff (app/, tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests

  mypy:
    name: mypy (app/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: mypy app

  frontend:
    name: frontend (oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: oxlint
        working-directory: frontend/apps/dms
        run: npx oxlint
      - name: tsc -b
        working-directory: frontend/apps/dms
        run: npx tsc -b
      - name: vitest
        working-directory: frontend/apps/dms
        run: npx vitest run
      - name: vite build
        working-directory: frontend/apps/dms
        run: npx vite build

  docker-build:
    name: docker image builds (WP-2 PR-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t dms-platform:ci .

  migration-smoke-test:
    name: alembic migration smoke test (postgres)
